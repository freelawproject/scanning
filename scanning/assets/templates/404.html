{% extends "base.html" %}

{% block title %}Page Not Found - FLP Scanning Portal{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
  <div class="text-center">
    <h1 class="text-6xl font-bold text-gray-300 dark:text-gray-600">404</h1>
    <p class="mt-4 text-xl font-medium text-gray-700 dark:text-gray-300">Page not found</p>
    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{% url 'scan_list' %}" class="btn-primary mt-6 inline-block">
      Back to scans
    </a>
  </div>
</div>
{% endblock %}
