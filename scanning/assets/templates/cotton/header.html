<header class="border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900">
  <div class="max-w-content mx-auto px-4 flex items-center justify-between h-16">
    <a href="{% url 'scan_list' %}" class="text-xl font-bold text-gray-900 dark:text-white no-underline hover:no-underline">
      FLP Scanning Portal
    </a>

    <!-- Mobile menu button -->
    <button
      type="button"
      class="sm:hidden btn-ghost p-2"
      onclick="document.getElementById('mobile-nav').classList.toggle('hidden')"
      aria-label="Toggle menu"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Desktop nav -->
    <nav class="hidden sm:flex items-center gap-4">
      {% if user.is_authenticated %}
        <a href="{% url 'scan_list' %}" class="btn-ghost text-sm">Scans</a>
        <a href="{% url 'queue' %}" class="btn-ghost text-sm">Queue</a>
        <a href="{% url 'opinion_list' %}" class="btn-ghost text-sm">Opinion Scans</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn-ghost text-sm">Sign out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn-outline text-sm">Sign in</a>
      {% endif %}
    </nav>
  </div>

  <!-- Mobile nav -->
  <div id="mobile-nav" class="hidden sm:hidden border-t border-gray-200 dark:border-gray-700">
    <div class="px-4 py-3 space-y-2">
      {% if user.is_authenticated %}
        <a href="{% url 'scan_list' %}" class="block btn-ghost text-sm">Scans</a>
        <a href="{% url 'queue' %}" class="block btn-ghost text-sm">Queue</a>
        <a href="{% url 'opinion_list' %}" class="block btn-ghost text-sm">Opinion Scans</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="block w-full text-left btn-ghost text-sm">Sign out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="block btn-outline text-sm text-center">Sign in</a>
      {% endif %}
    </div>
  </div>
</header>
