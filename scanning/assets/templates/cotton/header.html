{% load static %}
<header class="border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900">
  <div class="max-w-content mx-auto px-4 flex items-center justify-between h-16">
    <a href="{% url 'scan_list' %}" class="flex items-center gap-2 text-xl font-bold text-gray-900 dark:text-white no-underline hover:no-underline">
      <img src="{% static 'svg/favicon.svg' %}" alt="" class="h-7 w-7 shrink-0 rounded">
      FLP Scanning Portal
    </a>

    <!-- Mobile menu button -->
    <button
      type="button"
      class="sm:hidden btn-ghost p-2"
      onclick="document.getElementById('mobile-nav').classList.toggle('hidden')"
      aria-label="Toggle menu"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Desktop nav -->
    <nav class="hidden sm:flex items-center">
      {% if user.is_authenticated %}
        <a href="{% url 'scan_upload' %}" class="btn-ghost text-sm whitespace-nowrap"><i class="fa fa-fw fa-upload"></i> Upload book scan</a>
        <a href="{% url 'scan_list' %}" class="btn-ghost text-sm whitespace-nowrap"><i class="fa fa-fw fa-book"></i> Book Scans</a>
        <a href="{% url 'opinion_list' %}" class="btn-ghost text-sm whitespace-nowrap"><i class="fa fa-fw fa-file-text"></i> Opinion Scans</a>
        <!-- User dropdown -->
        <div class="relative">
          <button
            type="button"
            class="btn-ghost text-sm whitespace-nowrap"
            onclick="this.nextElementSibling.classList.toggle('hidden')"
          >
            <i class="fa fa-fw fa-user"></i> {{ user.username }} <i class="fa fa-caret-down ml-1"></i>
          </button>
          <div class="hidden absolute right-0 mt-1 w-44 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-md shadow-lg z-50 py-1">
            <a href="{% url 'profile' %}" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
              <i class="fa fa-fw fa-cog"></i> Profile
            </a>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
                <i class="fa fa-fw fa-sign-out"></i> Sign out
              </button>
            </form>
          </div>
        </div>
      {% else %}
        <a href="{% url 'login' %}" class="btn-outline text-sm">Sign in</a>
      {% endif %}
    </nav>
  </div>

  <!-- Mobile nav -->
  <div id="mobile-nav" class="hidden sm:hidden border-t border-gray-200 dark:border-gray-700">
    <div class="px-4 py-3 space-y-2">
      {% if user.is_authenticated %}
        <a href="{% url 'scan_upload' %}" class="block btn-ghost text-sm"><i class="fa fa-fw fa-upload"></i> Upload book scan</a>
        <a href="{% url 'scan_list' %}" class="block btn-ghost text-sm"><i class="fa fa-fw fa-book"></i> Book Scans</a>
        <a href="{% url 'opinion_list' %}" class="block btn-ghost text-sm"><i class="fa fa-fw fa-file-text"></i> Opinion Scans</a>
        <a href="{% url 'profile' %}" class="block btn-ghost text-sm"><i class="fa fa-fw fa-cog"></i> Profile</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="block w-full text-left btn-ghost text-sm"><i class="fa fa-fw fa-sign-out"></i> Sign out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="block btn-outline text-sm text-center">Sign in</a>
      {% endif %}
    </div>
  </div>
</header>

<!-- Close user dropdown when clicking outside -->
<script>
  document.addEventListener("click", function (e) {
    document.querySelectorAll("header .relative").forEach(function (dropdown) {
      if (!dropdown.contains(e.target)) {
        var menu = dropdown.querySelector("div");
        if (menu) menu.classList.add("hidden");
      }
    });
  });
</script>
