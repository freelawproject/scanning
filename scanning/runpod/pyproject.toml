[project]
name = "blackletter-gpu-worker"
version = "0.0.1"
description = "RunPod Serverless handler for the blackletter GPU steps (detect, analyze)."
requires-python = ">=3.12,<3.14"
dependencies = [
    # GPU stack
    "torch",
    "torchvision",
    "paddlepaddle-gpu==3.1.0",

    # Inference and OCR
    "ultralytics>=8.3",
    "opencv-python==4.10.0.84",
    "paddleocr>=3.4.0",
    "pytesseract>=0.3.13",
    "ocrmypdf>=17",

    # Weight fetching and PDF handling
    "pymupdf>=1.25",
    "pypdfium2>=4.0.0",
    "huggingface_hub>=0.20.0",

    # RunPod plumbing
    "requests>=2.33,<3",
    "runpod>=1.9,<2",
    "sentry-sdk>=2,<3",

    "blackletter>=0.1.1",
]

# This project is an application (handler.py), not a library. Tell uv
# not to try to build it as an installable package.
[tool.uv]
package = false

# Route GPU-specific wheels to their vendor indexes. Other deps come
# from PyPI by default. ``explicit = true`` means these indexes are
# only searched for packages explicitly routed via ``[tool.uv.sources]``
# ; plain PyPI packages never accidentally fall through to them.
[tool.uv.sources]
torch = { index = "pytorch-gpu" }
torchvision = { index = "pytorch-gpu" }
paddlepaddle-gpu = { index = "paddle-gpu" }
# TEMPORARY: bl-warm (freelawproject/blackletter#73) is unmerged and
# unreleased, so the PyPI blackletter has neither the bl_warm adapter
# nor a bl_warm entry in its Hugging Face weight table. Detection with
# YOLO_DETECT_MODELS=["bl_warm"] fails on a PyPI-pinned worker with
# "Weight .../bl_warm.pt is missing and has no Hugging Face source."
# Pinned to a rev, not the branch: the PR head lives on a fork and can
# be force-pushed. Drop this source and go back to the PyPI pin once
# #73 merges and ships a release.
blackletter = { git = "https://github.com/rachlllg/blackletter.git", rev = "b87b794c2da56e89d833bf5fa6dcbc327253e877" }

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "paddle-gpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
