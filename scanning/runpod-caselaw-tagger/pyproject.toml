[project]
name = "caselaw-tagger-gpu-worker"
version = "0.0.1"
description = "RunPod Serverless handler for the case-law block tagger (ModernBERT token classification)."
requires-python = ">=3.12,<3.14"
dependencies = [
    # GPU stack. torch comes from the cu126 index below, and its
    # nvidia-* dependencies carry the CUDA runtime, which is why the
    # image needs no CUDA base layer (the rule of ../runpod/).
    #
    # Pinned to the version the detection worker has run on RunPod
    # hosts, on purpose. An open pin resolved to 2.14, which routes
    # small eager operations (the rotary-embedding outer product among
    # them) through Triton kernels on CUDA; Triton then compiles a C
    # helper on first use and the slim base image had no compiler, so
    # the first GPU job failed with "Failed to find C compiler". The
    # Dockerfile installs gcc as a backstop; this pin keeps the proven
    # path. Bump deliberately, with a GPU run.
    "torch==2.13.0",

    # Inference. The checkpoint is saved by transformers 5 (its
    # tokenizer_config names ``TokenizersBackend`` and its config
    # carries ``rope_parameters``), which transformers 4 cannot read.
    "transformers>=5,<6",
    "safetensors>=0.4",
    # ``snapshot_download`` bakes the weights at build time; transformers
    # depends on it anyway, so this only pins the floor.
    "huggingface-hub>=0.30",

    # RunPod plumbing
    "requests>=2.33,<3",
    "runpod>=1.9,<2",
    "sentry-sdk>=2,<3",
]

# This project is an application (handler.py), not a library. Tell uv
# not to try to build it as an installable package.
[tool.uv]
package = false

# Route the GPU wheels to their vendor index. Other deps come from PyPI
# by default. ``explicit = true`` means this index is only searched for
# packages routed to it here, so a plain PyPI package never falls
# through to it.
[tool.uv.sources]
torch = { index = "pytorch-gpu" }

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
