[project]
name = "caselaw-tagger-gpu-worker"
version = "0.0.1"
description = "RunPod Serverless handler for the case-law block tagger (ModernBERT token classification)."
requires-python = ">=3.12,<3.14"
dependencies = [
    # GPU stack. torch comes from the cu126 index below, and its
    # nvidia-* dependencies carry the CUDA runtime, which is why the
    # image needs no CUDA base layer (the rule of ../runpod/).
    #
    # Pinned to the version the detection worker has run on RunPod
    # hosts, so a bump is a deliberate act with a GPU run behind it.
    # The pin is not what keeps the worker off run-time kernel
    # compilation; the triton override below is (see [tool.uv]).
    "torch==2.13.0",

    # Inference. The checkpoint is saved by transformers 5 (its
    # tokenizer_config names ``TokenizersBackend`` and its config
    # carries ``rope_parameters``), which transformers 4 cannot read.
    "transformers>=5,<6",
    "safetensors>=0.4",
    # ``snapshot_download`` bakes the weights at build time; transformers
    # depends on it anyway, so this only pins the floor.
    "huggingface-hub>=0.30",

    # RunPod plumbing
    "requests>=2.33,<3",
    "runpod>=1.9,<2",
    "sentry-sdk>=2,<3",
]

# This project is an application (handler.py), not a library. Tell uv
# not to try to build it as an installable package.
[tool.uv]
package = false
# No Triton in the image, on purpose. torch 2.13+ carries
# ``torch._native``: when Triton is importable it swaps some eager CUDA
# operations (the rotary-embedding outer product among them) for Triton
# kernels, and Triton compiles a C helper at first use, at run time,
# inside the worker. The first GPU jobs on RunPod died there three
# times: no compiler, then a compile that failed on the host, then the
# TORCH_DISABLE_NATIVE_JIT switch not reaching the process. With no
# ``triton`` package, ``torch._native.triton_utils`` reports the
# runtime unavailable and registers nothing, and every operation runs
# through torch's ordinary CUDA kernels -- the ones the model was
# trained and evaluated on. Eager inference needs nothing from Triton;
# only ``torch.compile`` does, and this worker never compiles. The
# impossible marker (python_version < '0' is provably false, so uv
# drops the package from the lock entirely) is the shape the dots.mocr
# worker uses for the same purpose. The Dockerfile asserts the absence
# at build time.
override-dependencies = [
    "triton; python_version < '0'",
]

# Route the GPU wheels to their vendor index. Other deps come from PyPI
# by default. ``explicit = true`` means this index is only searched for
# packages routed to it here, so a plain PyPI package never falls
# through to it.
[tool.uv.sources]
torch = { index = "pytorch-gpu" }

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
