[project]
name = "scanning"
version = "1"
description = "Upload portal for volunteer scanners to submit scanned legal documents."
requires-python = ">=3.12,<3.14"
authors = [
  { name = "Free Law Project", email = "info@free.law" },
]
keywords = ["scanning", "legal", "documents", "upload"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
]
license = "AGPL-3.0-only"
dependencies = [
  "Django>=6.0,<6.1",
  "boto3",
  "daphne",
  "django-cotton",
  "django-environ",
  "django-storages",
  "django-tailwind~=3.9.1",
  "factory-boy",
  "gunicorn",
  "pillow",
  "psycopg[binary,pool]",
  # Base blackletter only: pairing, redaction (skip_doctr=True), margins,
  # validation and the ink geometry — no torch/paddle. The heavy in-process
  # inference stack lives in the `local-ml` extra so the web/daemon images stay
  # lean whenever detection is offloaded to RunPod (RUNPOD_ENABLED=True).
  # 0.2.0 is the floor: it is the release that carries the ink geometry
  # (blackletter #68/#69) this app reads instead of measuring it here.
  "blackletter>=0.2.0",
  # No longer called directly: the pipeline embeds no text layer. Declared
  # so LLM_PAGE_TEXT_LAYER (blackletter's add_text_layer) has an engine, and
  # because base blackletter requires it anyway.
  "ocrmypdf>=17",
  # Used by ai.user_prompt to crop text off the generated LLM pages. Those
  # crops only return anything when LLM_PAGE_TEXT_LAYER is on; the pipeline
  # itself measures geometry from the page ink and needs no text.
  "pdfplumber>=0.11",
  "pymupdf>=1.25",
  "sentry-sdk[django]",
  "time-machine",
  "uvicorn[standard]",
  # Load-bearing despite nothing here importing it: blackletter.analyze uses
  # it as a per-crop digit fallback when PaddleOCR cannot read a page number,
  # and blackletter does not declare it itself.
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
  "django-debug-toolbar",
  "django-extensions",
  "django-stubs",
  "django-tailwind[reload]~=3.9.1",
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-django",
]
# Heavy in-process inference stack (YOLO + PaddleOCR + doctr, all CPU). Install
# wherever detection runs locally instead of on RunPod: local dev, CI, the
# offline daemon, and the RunPod worker image. Excluded from the lean web image.
local-ml = [
  "blackletter[detect,analyze]>=0.2.0",
  "torch",
  "torchvision",
  "ultralytics>=8.3",
  # cv2 comes in transitively (ultralytics, python-doctr, paddlex); its version
  # is pinned once in [tool.uv] override-dependencies to keep every cv2 variant
  # on one OpenCV ABI.
  "paddlepaddle",
  "paddleocr>=3.4.0",
]

[tool.setuptools.packages.find]
include = ["scanning*"]

[tool.ruff]
line-length = 79
lint.select = [
  # pycodestyle
  "E",
  # Pyflakes errors
  "F",
  # isort
  "I",
  # pyupgrade
  "UP",
  # Pyflakes warnings
  "W",
]
lint.ignore = [
  # line-too-long
  "E501",
  # suppressible-exception
  "SIM105",
  # if-else-block-instead-of-if-exp
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"scanning/settings/__init__.py" = ["F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "scanning.settings"
python_files = ["tests.py", "test_*.py"]

[tool.uv]
# Keep every cv2-providing distribution on one OpenCV version. The daemon
# (local-ml) tree pulls two variants that both own the top-level `cv2` package
# and cannot be deduplicated (paddleocr -> paddlex needs `opencv-contrib-python`;
# ultralytics, python-doctr and base blackletter need `opencv-python`). uv can't
# rename one into the other, so the best we can do is force a matching version:
# same OpenCV release means the same cv2 ABI, so whichever wheel writes
# `site-packages/cv2/` last, `import cv2` stays consistent. `opencv-python-headless`
# is listed defensively in case a transitive dep reintroduces it. Base blackletter
# no longer pulls headless as of blackletter #61 / 0.1.0.
override-dependencies = [
  "opencv-python==4.10.0.84",
  "opencv-contrib-python==4.10.0.84",
  "opencv-python-headless==4.10.0.84",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
paddlepaddle = { index = "paddle-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true
