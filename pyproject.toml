[project]
name = "scanning"
version = "1"
description = "Upload portal for volunteer scanners to submit scanned legal documents."
requires-python = ">=3.12,<3.14"
authors = [
  { name = "Free Law Project", email = "info@free.law" },
]
keywords = ["scanning", "legal", "documents", "upload"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
]
license = "AGPL-3.0-only"
dependencies = [
  "Django>=6.0,<6.1",
  "boto3",
  "daphne",
  "django-cotton",
  "django-environ",
  "django-storages",
  "django-tailwind~=3.9.1",
  "factory-boy",
  "gunicorn",
  "pillow",
  "psycopg[binary,pool]",
  # Base blackletter only: pairing, redaction (skip_doctr=True), margins,
  # validation and OCR — no torch/paddle. The heavy in-process inference stack
  # lives in the `local-ml` extra so the web/daemon images stay lean whenever
  # detection is offloaded to RunPod (RUNPOD_ENABLED=True).
  "blackletter>=0.0.10",
  "ocrmypdf>=17",
  "pdfplumber>=0.11",
  "pymupdf>=1.25",
  "sentry-sdk[django]",
  "time-machine",
  "uvicorn[standard]",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
  "django-debug-toolbar",
  "django-extensions",
  "django-stubs",
  "django-tailwind[reload]~=3.9.1",
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-django",
]
# Heavy in-process inference stack (YOLO + PaddleOCR + doctr, all CPU). Install
# wherever detection runs locally instead of on RunPod: local dev, CI, the
# offline daemon, and the RunPod worker image. Excluded from the lean web image.
local-ml = [
  "blackletter[detect,analyze]>=0.0.10",
  "torch",
  "torchvision",
  "ultralytics>=8.3",
  "opencv-python==4.10.0.84",
  "paddlepaddle",
  "paddleocr>=3.4.0",
]

[tool.setuptools.packages.find]
include = ["scanning*"]

[tool.ruff]
line-length = 79
lint.select = [
  # pycodestyle
  "E",
  # Pyflakes errors
  "F",
  # isort
  "I",
  # pyupgrade
  "UP",
  # Pyflakes warnings
  "W",
]
lint.ignore = [
  # line-too-long
  "E501",
  # suppressible-exception
  "SIM105",
  # if-else-block-instead-of-if-exp
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"scanning/settings/__init__.py" = ["F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "scanning.settings"
python_files = ["tests.py", "test_*.py"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
paddlepaddle = { index = "paddle-cpu" }
# TEMPORARY: track the blackletter extras-split branch until it is released.
# Once blackletter 0.0.14 is on PyPI, drop this source line and bump the
# blackletter specifiers below to >=0.0.14 so the build resolves from PyPI.
blackletter = { git = "https://github.com/freelawproject/blackletter.git", branch = "split-heavy-deps-into-extras" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true
