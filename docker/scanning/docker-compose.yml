# Run using `docker compose up` from this directory
networks:
  scanning_net:
    driver: bridge

services:
  # Database (PostgreSQL)
  scanning-postgres:
    container_name: scanning-postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "scanning"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scanning_net

  # Tailwind CSS watcher (rebuilds on file change)
  scanning-tailwind:
    container_name: scanning-tailwind
    image: node:22
    volumes:
      - ${SCANNING_BASE_DIR:-../../}:/opt/scanning
    working_dir: /opt/scanning
    env_file:
      - ../../.env.dev
    command: sh -c 'npm install && npm run dev'
    tty: true

  # Background daemon — run locally for dev (PaddlePaddle segfaults under x86 emulation):
  #   DEVELOPMENT=True DB_HOST=localhost DB_SSL_MODE=prefer uv run python manage.py run_daemon
  scanning-daemon:
    container_name: scanning-daemon
    platform: linux/amd64
    build:
      context: "${SCANNING_BASE_DIR:-../../}"
      dockerfile: "./docker/django/Dockerfile"
      target: dev
    command: run_daemon
    depends_on:
      scanning-postgres:
        condition: service_healthy
    user: root
    volumes:
      - ${SCANNING_BASE_DIR:-../../}:/opt/scanning
    networks:
      - scanning_net
    env_file:
      - ../../.env.dev
    environment:
      # CELERY_ENABLED=True in the shell switches the clock and the views
      # (#503), beside the `celery` profile.
      - CELERY_ENABLED=${CELERY_ENABLED:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEV_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_DEV_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

  # Celery broker (#503). Only read when CELERY_ENABLED=True.
  scanning-redis:
    container_name: scanning-redis
    image: redis:7-alpine
    networks:
      - scanning_net
    profiles: ["celery"]

  # Celery worker (#503): every queue in one container for dev. In
  # production each queue is its own deployment (CELERY_QUEUES). The
  # daemon is the clock: with CELERY_ENABLED=True it sends the ticks
  # here instead of running them, so start it with this profile too.
  scanning-celery-worker:
    container_name: scanning-celery-worker
    platform: linux/amd64
    build:
      context: "${SCANNING_BASE_DIR:-../../}"
      dockerfile: "./docker/django/Dockerfile"
      target: dev
    command: worker
    depends_on:
      scanning-postgres:
        condition: service_healthy
      scanning-redis:
        condition: service_started
    user: root
    volumes:
      - ${SCANNING_BASE_DIR:-../../}:/opt/scanning
    networks:
      - scanning_net
    env_file:
      - ../../.env.dev
    environment:
      - CELERY_ENABLED=True
      - CELERY_CONCURRENCY=2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEV_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_DEV_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    profiles: ["celery"]

  # Django dev server
  scanning-django:
    container_name: scanning-django
    platform: linux/amd64
    build:
      context: "${SCANNING_BASE_DIR:-../../}"
      dockerfile: "./docker/django/Dockerfile"
      target: dev
    command: web-dev
    depends_on:
      scanning-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    user: root
    volumes:
      - ${SCANNING_BASE_DIR:-../../}:/opt/scanning
    #      - ${BLACKLETTER_DIR:-../../../blackletter}:/opt/blackletter
    networks:
      - scanning_net
    env_file:
      - ../../.env.dev
    environment:
      # CELERY_ENABLED=True in the shell switches the clock and the views
      # (#503), beside the `celery` profile.
      - CELERY_ENABLED=${CELERY_ENABLED:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEV_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_DEV_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
