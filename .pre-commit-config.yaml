# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: migrations
default_language_version:
  python: "python3.13"
ci:
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
     - id: check-added-large-files
       # The GPU workers' uv.lock files are intentionally large (locked
       # deps: torch cu126 + paddlepaddle-gpu + blackletter for runpod,
       # the vLLM client stack + dots_mocr for runpod-dotsmocr, plus
       # their transitives). Reproducible builds require tracking them.
       exclude: ^scanning/runpod(-dotsmocr)?/uv\.lock$
     - id: check-ast
     - id: check-json
     - id: check-merge-conflict
     - id: check-toml
     - id: check-xml
     - id: check-yaml
     - id: debug-statements
     - id: detect-private-key
     - id: fix-byte-order-marker
     - id: trailing-whitespace
       args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
