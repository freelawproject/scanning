name: Build and Push RunPod LightOn Worker

on:
  push:
    branches:
      - main
    paths:
      - 'scanning/runpod-lighton/**'
  workflow_dispatch:

jobs:
  build-runpod-lighton-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The base image is ~10 GB and the baked weights ~2 GB, which
      # together overrun the hosted runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: scanning/runpod-lighton
          push: true
          tags: |
            freelawproject/lighton-gpu-worker:${{ steps.vars.outputs.sha_short }}
            freelawproject/lighton-gpu-worker:latest
          cache-from: type=registry,ref=freelawproject/lighton-gpu-worker:cache
          cache-to: type=registry,ref=freelawproject/lighton-gpu-worker:cache,mode=max

      # Skipped until the endpoint exists and its template id is stored
      # as RUNPOD_LIGHTON_TEMPLATE_ID, so the first builds publish the
      # image without failing on a missing secret.
      - name: Update RunPod template image
        if: ${{ secrets.RUNPOD_LIGHTON_TEMPLATE_ID != '' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_LIGHTON_TEMPLATE_ID }}
          IMAGE: freelawproject/lighton-gpu-worker:${{ steps.vars.outputs.sha_short }}
        run: |
          set -euo pipefail
          # Sends only `imageName`. RunPod's partial PATCH preserves other
          # fields, but if env vars are later added to the template,
          # re-verify they survive or switch to read-modify-write.
          payload=$(jq -nc --arg img "$IMAGE" '{imageName: $img}')
          response=$(curl -sS -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://rest.runpod.io/v1/templates/$RUNPOD_TEMPLATE_ID")
          body=$(printf '%s\n' "$response" | sed '$d')
          status=$(printf '%s\n' "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -ge 400 ]; then
            echo "::error::RunPod template update failed (HTTP $status)"
            exit 1
          fi
