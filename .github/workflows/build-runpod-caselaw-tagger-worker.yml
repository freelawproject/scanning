name: Build and Push RunPod Case-law Tagger Worker

on:
  push:
    branches:
      - main
    paths:
      - 'scanning/runpod-caselaw-tagger/**'
      - 'scanning/runpod_common.py'
      - '.github/workflows/build-runpod-caselaw-tagger-worker.yml'
  workflow_dispatch:

jobs:
  build-runpod-caselaw-tagger-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The venv layer holds the cu126 torch wheels (~6 GB, twice with
      # the uv cache mount) plus a 1.6 GB model snapshot, against
      # ~14-21 GB free on the stock runner. Dropping the preinstalled
      # toolchains we never use frees ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # scanning/ as context so the build can COPY the shared
          # runpod_common.py next to handler.py.
          context: scanning
          file: scanning/runpod-caselaw-tagger/Dockerfile
          push: true
          tags: |
            freelawproject/caselaw-tagger-gpu-worker:${{ steps.vars.outputs.sha_short }}
            freelawproject/caselaw-tagger-gpu-worker:latest
          cache-from: type=registry,ref=freelawproject/caselaw-tagger-gpu-worker:cache
          cache-to: type=registry,ref=freelawproject/caselaw-tagger-gpu-worker:cache,mode=max

      - name: Update RunPod endpoint image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE: freelawproject/caselaw-tagger-gpu-worker:${{ steps.vars.outputs.sha_short }}
        run: .github/scripts/runpod-release.sh
