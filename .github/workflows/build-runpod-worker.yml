name: Build and Push RunPod Worker

on:
  push:
    branches:
      - main
    paths:
      - 'scanning/runpod/**'
      - 'scanning/runpod_common.py'
      - '.github/workflows/build-runpod-worker.yml'
  workflow_dispatch:

jobs:
  build-runpod-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The venv layer is ~8 GB and the uv cache mount holds ~6 GB of
      # cu126 wheels next to it, against ~14-21 GB free on the stock
      # runner. The routine trigger is a blackletter bump, which
      # invalidates the `uv sync` layer and re-downloads all of it.
      # Dropping the preinstalled toolchains we never use frees ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # scanning/ as context so the build can COPY the shared
          # runpod_common.py next to handler.py.
          context: scanning
          file: scanning/runpod/Dockerfile
          push: true
          tags: |
            freelawproject/blackletter-gpu-worker:${{ steps.vars.outputs.sha_short }}
            freelawproject/blackletter-gpu-worker:latest
          cache-from: type=registry,ref=freelawproject/blackletter-gpu-worker:cache
          cache-to: type=registry,ref=freelawproject/blackletter-gpu-worker:cache,mode=max

      - name: Update RunPod template image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
          IMAGE: freelawproject/blackletter-gpu-worker:${{ steps.vars.outputs.sha_short }}
        run: |
          set -euo pipefail
          # Sends only `imageName`. RunPod's partial PATCH preserves other
          # fields, but if env vars are later added to the template,
          # re-verify they survive or switch to read-modify-write.
          payload=$(jq -nc --arg img "$IMAGE" '{imageName: $img}')
          response=$(curl -sS -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://rest.runpod.io/v1/templates/$RUNPOD_TEMPLATE_ID")
          body=$(printf '%s\n' "$response" | sed '$d')
          status=$(printf '%s\n' "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -ge 400 ]; then
            echo "::error::RunPod template update failed (HTTP $status)"
            exit 1
          fi
