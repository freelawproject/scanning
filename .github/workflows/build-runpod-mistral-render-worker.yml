name: Build and Push RunPod Mistral Render Worker

on:
  push:
    branches:
      - main
    paths:
      - 'scanning/runpod-mistral-render/**'
      - 'scanning/runpod_common.py'
      - 'scanning/perpendiculars.py'
      - '.github/workflows/build-runpod-mistral-render-worker.yml'
  workflow_dispatch:

jobs:
  build-runpod-mistral-render-worker:
    runs-on: ubuntu-latest
    env:
      # Mapped here because a step-level `if` cannot read `secrets`
      # directly. Empty until the endpoint exists and its template id
      # is stored as RUNPOD_MISTRAL_RENDER_TEMPLATE_ID, so the first
      # builds publish the image without failing on a missing secret.
      RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_MISTRAL_RENDER_TEMPLATE_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # scanning/ as context so the build can COPY the shared
          # runpod_common.py and perpendiculars.py next to handler.py.
          context: scanning
          file: scanning/runpod-mistral-render/Dockerfile
          push: true
          tags: |
            freelawproject/mistral-render-worker:${{ steps.vars.outputs.sha_short }}
            freelawproject/mistral-render-worker:latest
          cache-from: type=registry,ref=freelawproject/mistral-render-worker:cache
          cache-to: type=registry,ref=freelawproject/mistral-render-worker:cache,mode=max

      - name: Update RunPod template image
        if: ${{ env.RUNPOD_TEMPLATE_ID != '' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE: freelawproject/mistral-render-worker:${{ steps.vars.outputs.sha_short }}
        run: |
          set -euo pipefail
          # Sends only `imageName`. RunPod's partial PATCH preserves other
          # fields (the MISTRAL_API_KEY env among them), but if more env
          # vars are later added to the template, re-verify they survive
          # or switch to read-modify-write.
          payload=$(jq -nc --arg img "$IMAGE" '{imageName: $img}')
          response=$(curl -sS -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://rest.runpod.io/v1/templates/$RUNPOD_TEMPLATE_ID")
          body=$(printf '%s\n' "$response" | sed '$d')
          status=$(printf '%s\n' "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -ge 400 ]; then
            echo "::error::RunPod template update failed (HTTP $status)"
            exit 1
          fi
