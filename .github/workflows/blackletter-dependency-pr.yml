name: Auto-update blackletter Dependency

on:
  workflow_dispatch:

jobs:
  update-blackletter-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '>= 3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.9.x"

      - name: Update blackletter dependency
        # `uv lock`, not `uv sync`: only the lockfiles go into the PR,
        # so nothing needs to be installed. A sync of scanning/runpod
        # would pull the worker's multi-GB cu126 torch stack onto the
        # runner and can fill its disk, which kills the step and
        # silently skips the PR creation below.
        run: |
          uv lock --upgrade-package blackletter
          uv lock --upgrade-package blackletter --project scanning/runpod

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update blackletter dependency
          title: Update blackletter dependency
          body: This PR updates the blackletter dependency to its latest version
          branch: update-blackletter-dependency
