name: Build and Push RunPod dots.mocr Worker

on:
  push:
    branches:
      - main
    paths:
      - 'scanning/runpod-dotsmocr/**'
      - 'scanning/runpod_common.py'
      - 'scanning/layout_json.py'
      - 'scanning/perpendiculars.py'
      - '.github/workflows/build-runpod-dotsmocr-worker.yml'
      - '.github/scripts/runpod-release.sh'
  workflow_dispatch:

# One build of this image at a time, in push order: the release step
# moves the endpoint to its own tag, so an older build that finished
# last would move the endpoint back.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-runpod-dotsmocr-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The vLLM base image plus baked model weights extract to well
      # over 25 GB; the stock runner doesn't have that much headroom.
      # Dropping the preinstalled toolchains we never use frees ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # scanning/ as context so the build can COPY the shared
          # runpod_common.py next to handler.py.
          context: scanning
          file: scanning/runpod-dotsmocr/Dockerfile
          push: true
          tags: |
            freelawproject/dotsmocr-gpu-worker:${{ steps.vars.outputs.sha_short }}
            freelawproject/dotsmocr-gpu-worker:latest
          cache-from: type=registry,ref=freelawproject/dotsmocr-gpu-worker:cache
          cache-to: type=registry,ref=freelawproject/dotsmocr-gpu-worker:cache,mode=max

      - name: Update RunPod endpoint image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE: freelawproject/dotsmocr-gpu-worker:${{ steps.vars.outputs.sha_short }}
        run: .github/scripts/runpod-release.sh
