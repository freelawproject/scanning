name: Build and Push RunPod Surya Worker

on:
  push:
    branches:
      - main
    paths:
      - 'scanning/runpod-surya/**'
      - 'scanning/runpod_common.py'
      - 'scanning/perpendiculars.py'
      - '.github/workflows/build-runpod-surya-worker.yml'
  workflow_dispatch:

jobs:
  build-runpod-surya-worker:
    runs-on: ubuntu-latest
    env:
      # Mapped here because a step-level `if` cannot read `secrets`
      # directly. Empty until the endpoint exists and its id is stored
      # as RUNPOD_SURYA_ENDPOINT_ID, so the first builds
      # publish the image without failing on a missing secret.
      RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_SURYA_ENDPOINT_ID }}
    steps:
      - uses: actions/checkout@v6

      # The vLLM base image plus baked model weights extract to well
      # over 25 GB; the stock runner doesn't have that much headroom.
      # Dropping the preinstalled toolchains we never use frees ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # scanning/ as context so the build can COPY the shared
          # runpod_common.py next to handler.py.
          context: scanning
          file: scanning/runpod-surya/Dockerfile
          push: true
          tags: |
            freelawproject/surya-gpu-worker:${{ steps.vars.outputs.sha_short }}
            freelawproject/surya-gpu-worker:latest
          cache-from: type=registry,ref=freelawproject/surya-gpu-worker:cache
          cache-to: type=registry,ref=freelawproject/surya-gpu-worker:cache,mode=max

      - name: Update RunPod endpoint image
        if: ${{ env.RUNPOD_ENDPOINT_ID != '' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE: freelawproject/surya-gpu-worker:${{ steps.vars.outputs.sha_short }}
        run: .github/scripts/runpod-release.sh
